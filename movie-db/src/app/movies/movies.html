<main class="page-shell">
  <section class="intro" aria-labelledby="page-title">
    <p class="eyebrow"><span class="eyebrow-dot"></span> THE MOVIE COLLECTION</p>
    <h1 id="page-title">Explore movies.</h1>
  </section>

  <app-movie-filters />

  <section class="results" aria-labelledby="results-title" aria-live="polite">
    <div class="results-heading">
      <div>
        <p class="results-kicker">PICKED FOR THE CURIOUS</p>
        <h2 id="results-title">Movies to remember</h2>
      </div>
      <span class="result-count">0</span>
    </div>

    <!-- TODO: Show the loading panel while a request is in progress.
    <app-movies-loading />
    -->
    <!-- TODO: Show the error panel and connect its retry action when a request fails.
    <app-movies-error />
    -->
    <!-- TODO: Show the empty panel when a completed request has no results.
    <app-movies-empty />
    -->
    <div class="movie-grid">
      @for (movie of movies(); track movie.id; let i = $index) {
        <app-movie-card [movie]="movie" [index]="i" />
      }
    </div>
  </section>
</main>
